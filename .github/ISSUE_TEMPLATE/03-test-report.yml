name: 🔬 Test report / 实机测试报告
description: You tested something on real hardware — working or not, we want the numbers. / 你在实机上试了某个东西，不管通没通，把数字发过来。
title: "[Report] "
labels: ["test-report"]
body:
  - type: markdown
    attributes:
      value: |
        **Reports of what breaks are as useful as patches**, and a confirmation that something works is not noise — several conclusions in `docs/` were overturned by exactly one user's measurement.
        **报告哪里坏了和交补丁一样有价值**，"能用"的确认也不是废话 —— `docs/` 里有好几条结论就是被某位用户的一次实测推翻的。

        Two things currently waiting on someone with the right accessory:
        目前有两件事在等有相应配件的人：
        * **Headphone jack and headset microphone** — fixed and measured at the PCM level (DMA consuming 48960 frames/s), but nobody has plugged in headphones yet. / **耳机口和耳机麦**：PCM 层已经修好并量过，但还没有人真插耳机听过。
        * **Audio / Bluetooth deadlock after long uptime** — reported once, never reproduced. If it happens to you, check `/data/vendor/gaokun3/` for a `hangdump-*` directory; the watchdog collects the evidence automatically. / **长时间运行后音频/蓝牙死锁**：只被报过一次，从未复现。如果你碰上了，去 `/data/vendor/gaokun3/` 看有没有 `hangdump-*` 目录，看门狗会自动留证。

  - type: dropdown
    id: subject
    attributes:
      label: What you tested / 测了什么
      multiple: true
      options:
        - Headphone jack / 耳机口
        - Headset microphone / 耳机麦
        - Internal microphone / 内置麦
        - Speakers / 扬声器
        - Bluetooth — audio, pairing, long uptime / 蓝牙
        - Audio or Bluetooth deadlock after long uptime / 长时间运行后的音频蓝牙死锁
        - Touchscreen / pen / 触摸或手写笔
        - Keyboard / touchpad / 键盘触控板
        - Sensors / auto-rotate / 传感器与自动旋转
        - Camera / 摄像头
        - USB-C DisplayPort / external display / 外接显示
        - Charging / battery life / thermals / 充电、续航、温度
        - Hardware video decode / 硬件视频解码
        - OTA update / OTA 更新
        - A different SC8280XP machine (X13s, other) / 另一台 SC8280XP 机器
        - Other / 其他
    validations:
      required: true

  - type: dropdown
    id: outcome
    attributes:
      label: Outcome / 结果
      options:
        - "Works, as documented / 能用，和文档一致"
        - "Works, but differently than documented / 能用，但和文档说的不一样"
        - "Partly works / 半通"
        - "Does not work / 不通"
        - "Worse than documented — a regression / 比文档描述的更差，疑似回归"
    validations:
      required: true

  - type: input
    id: hardware
    attributes:
      label: Machine / 机器
      description: |
        Model, SKU, BIOS version. If you are testing a **different** SC8280XP machine, say which one — some findings here (the missing CPU cooling maps, the sensor stack) apply to the whole SoC, not just this tablet.
        型号、SKU、BIOS 版本。如果测的是**别的** SC8280XP 机器，请写清是哪台 —— 本项目有些结论（CPU 缺 cooling map、传感器那一套）对整颗 SoC 都成立，不限于这台平板。
      placeholder: "GK-W7X, SKU C233, BIOS 2.16"
    validations:
      required: true

  - type: textarea
    id: build
    attributes:
      label: Build / 版本
      description: |
        ```
        getprop ro.build.display.id; getprop ro.build.date; uname -a; bootctl get-current-slot
        ```
      render: shell
    validations:
      required: true

  - type: textarea
    id: procedure
    attributes:
      label: What exactly you did / 具体怎么测的
      description: |
        The commands, in order. "Plugged in headphones and pressed play in YouTube" is a valid procedure — just say which app and which output.
        按顺序把命令写出来。"插上耳机在 YouTube 里点播放"也是合格的步骤 —— 写清哪个应用、哪路输出就行。
      placeholder: |
        1. Plugged 3.5 mm headphones into the jack
        2. Played a file in the Music app
        3. adb shell cat /proc/asound/card0/pcm0p/sub0/status
    validations:
      required: true

  - type: textarea
    id: measurements
    attributes:
      label: Numbers and evidence / 数字与证据
      description: |
        Anything mechanical beats an impression. Useful probes on this device:
        任何机械可读的数据都好过主观感受。本机可用的探针：
        * audio: `cat /proc/asound/card0/pcm0p/sub0/status` (`state: RUNNING` and an advancing `hw_ptr` proves the DMA is really consuming data), `tinymix`, `dumpsys media.audio_flinger` / 音频
        * sensors: `dumpsys sensorservice`, `gaokun3-ssc-test` / 传感器
        * graphics: `dumpsys SurfaceFlinger`, `logcat -b all -s vulkan` / 图形
        * thermals: `for z in /sys/class/thermal/thermal_zone*; do cat $z/type $z/temp; done` / 温度
        * hangs: `/data/vendor/gaokun3/hangdump-*/` / 死锁取证
        * always useful: `dmesg` around the moment it happened / 出问题那一刻前后的 `dmesg`
      render: shell

  - type: textarea
    id: extra
    attributes:
      label: Anything else / 其他补充
