name: 🎮 Game report / 游戏兼容性报告
description: A game runs, crashes, or renders wrong. Stable arm64 gaming is the point of this port. / 某个游戏能跑、会崩、或者画面不对。这个移植的目标就是稳定跑 arm64 手游。
title: "[Game] "
labels: ["game-report"]
body:
  - type: markdown
    attributes:
      value: |
        This is arm64 native — no translation layer — on Mesa `turnip` (hardware Vulkan on the Adreno 690). GLES titles go through ANGLE on top of turnip, so a GL-only failure is a different bug from a Vulkan one; naming the renderer helps a lot.
        本机是 arm64 原生，没有转译层，图形走 Mesa `turnip`（Adreno 690 硬件 Vulkan）。GLES 游戏是 ANGLE 叠在 turnip 上，所以"只有 GL 路径炸"和"Vulkan 炸"是两种 bug —— 写清渲染后端很有帮助。

        ⚠️ Known and **not** a bug of ours: some titles pin their render buffer by a device allowlist. Genshin Impact renders at 1080×1728 here regardless of the logical resolution — that is the game's device tier, not a limit of this port. Spoofing a model to raise it carries account risk and is deliberately not done.
        ⚠️ 已知且**不是本项目的 bug**：有些游戏按**设备白名单**给渲染档位。原神在本机被钉在 1080×1728，改逻辑分辨率也不动 —— 那是游戏给的档位，不是我们的技术限制。伪装机型有账号风险，故意没做。

  - type: input
    id: game
    attributes:
      label: Game and version / 游戏与版本
      placeholder: "Genshin Impact 5.x, from the official APK"
    validations:
      required: true

  - type: dropdown
    id: outcome
    attributes:
      label: Outcome / 结果
      options:
        - "Runs well / 流畅可玩"
        - "Runs, but with visual glitches / 能跑，但画面有问题"
        - "Runs, but too slow to play / 能跑，但太卡"
        - "Crashes during play / 玩着崩"
        - "Crashes at launch / 启动就崩"
        - "Will not install or refuses to start (integrity check, unsupported device) / 装不上或拒绝启动（完整性校验、不支持的设备）"
    validations:
      required: true

  - type: textarea
    id: build
    attributes:
      label: Build / 版本
      description: |
        ```
        getprop ro.build.display.id; getprop ro.build.date; uname -a; getprop ro.hardware.vulkan
        ```
        ⚠️ If `ro.hardware.vulkan` says `pastel` you are on the software rasterizer fallback, and any performance figure is meaningless.
        ⚠️ 如果 `ro.hardware.vulkan` 是 `pastel`，那你在软渲染兜底路径上，性能数字没有意义。
      render: shell
    validations:
      required: true

  - type: input
    id: settings
    attributes:
      label: In-game graphics settings / 游戏内画质设置
      placeholder: "Highest preset, 60 fps cap, motion blur off"

  - type: textarea
    id: performance
    attributes:
      label: Performance / 性能
      description: |
        Frame rate as observed, plus whatever you can capture while it runs:
        观测到的帧率，加上运行期间能抓到的东西：
        ```
        cat /sys/class/devfreq/*gpu/cur_freq
        for z in /sys/class/thermal/thermal_zone*; do echo "$(cat $z/type) $(cat $z/temp)"; done
        dumpsys gfxinfo <package>
        ```
      render: shell

  - type: textarea
    id: logs
    attributes:
      label: Logs / 日志
      description: |
        For a crash, the tombstone is the single most valuable artifact:
        崩溃的话，tombstone 是最有价值的东西：
        * `adb shell ls /data/tombstones/` then pull the newest one / 拉最新那个
        * `adb logcat -b all -d > logcat.txt` covering the crash / 覆盖崩溃时刻
        * GPU-side trouble shows up as `a6xx_recover`, `GMU`, or SMMU fault lines in `dmesg` — a healthy machine has zero of all three / GPU 侧的毛病会在 `dmesg` 里表现为 `a6xx_recover`、`GMU`、SMMU fault —— 正常机器这三样都是 0
      render: shell

  - type: textarea
    id: extra
    attributes:
      label: Anything else / 其他补充
      description: Screenshots or a short video are genuinely useful for rendering glitches. / 画面问题请附截图或短视频，这类问题确实要看图。
