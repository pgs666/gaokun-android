name: 🛠 Development task / 开发任务
description: You intend to build something, or want to take a help-wanted item. / 你打算动手做某件事，或者想认领 help-wanted 里的一项。
title: "[Task] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Nothing about this platform exists in any wiki or in any model's training data, so a proposal is only as good as its evidence. **"Vendor X ships this, so it should work here" is not evidence** — there is no Android BSP for the 8cx family at all, and several plausible-sounding conclusions in this repo turned out to be flatly wrong.
        这个平台的任何东西都不在任何 wiki 或任何模型的训练数据里，所以提案的价值全在证据上。**"某厂有这个功能所以本机应该也行"不算证据** —— 8cx 系列压根没有 Android BSP，而本仓里好几条听起来很有道理的结论后来被证明是错的。

        Please check [`docs/TODO.md`](https://github.com/vahiru/gaokun-android/blob/main/docs/TODO.md) first — most obvious ideas are already there, usually with the reason they are parked.
        先看一眼 [`docs/TODO.md`](https://github.com/vahiru/gaokun-android/blob/main/docs/TODO.md) —— 显而易见的想法基本都在里面，而且大多写了为什么搁置。

        ⚠️ **This form is for work you plan to do, or think through in enough detail to hand over.** If you simply want the ROM to gain a capability, use the **Feature request** template — it asks less of you and is the right place for a wish.
        ⚠️ **这个表单是给"打算动手"或"已经想到能交接的程度"的人用的。** 如果你只是希望这个 ROM 多一个能力，请用 **功能申请** 模板 —— 那个要填的少得多，提需求走那边就对了。

  - type: dropdown
    id: kind
    attributes:
      label: Kind / 类型
      options:
        - "I want to work on this myself / 我想自己做这个"
        - "Proposal, worked out enough for someone else to pick up / 提案，已想到别人能接手的程度"
        - "Claiming an item from Help wanted / 认领 Help wanted 里的一项"
        - "Question about how something is designed here / 想问本项目某处为什么这么设计"
    validations:
      required: true

  - type: input
    id: existing
    attributes:
      label: Related backlog item, if any / 对应的待办项（如果有）
      placeholder: "Help wanted #1 — Codec2 on V4L2  /  docs/TODO.md D4"

  - type: textarea
    id: what
    attributes:
      label: What and why / 做什么、为什么
      description: What the machine cannot do today, and what it would be able to do afterwards. / 现在做不到什么，做完之后能做到什么。
    validations:
      required: true

  - type: textarea
    id: evidence
    attributes:
      label: Evidence it is possible on this hardware / 本机可行的证据
      description: |
        Source paths with line numbers, `dmesg` lines, sysfs nodes that exist, an upstream commit — anything checkable. If you are not sure it is possible, say so plainly; "I do not know, this needs verification" is a perfectly good answer here and costs everyone far less than a confident guess.
        源码路径加行号、`dmesg` 行、确实存在的 sysfs 节点、上游 commit —— 任何可核对的东西。不确定就直说：在这个项目里"我不确定，需要验证"是完全合格的回答，比一个自信的猜测便宜得多。
    validations:
      required: true

  - type: textarea
    id: first-step
    attributes:
      label: First verifiable step / 第一个可验证的步骤
      description: |
        The smallest change whose success or failure can be observed on the device, and how you would observe it. Work here moves in increments that can be checked on hardware.
        最小的那一步改动 —— 在设备上能看出成没成，以及你打算怎么看。这个项目的活是按"实机可验证的增量"推进的。
      placeholder: "Build v4l2_codec2 with poolmask 0xfc0000, then check whether a c2.v4l2.* entry appears in `dumpsys media.metrics` / `adb shell cmd media.codec list`."
    validations:
      required: true
